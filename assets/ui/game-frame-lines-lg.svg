<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1656 907" preserveAspectRatio="none" fill="none">
  <!--
    Large-top-band variant of game-frame-lines.svg, used in Small Device mode
    (Steam Deck / small laptops / touch). IDENTICAL to that file except the
    toolbar band is taller so the top-row controls can be chunky touch targets:
    the under-toolbar rule, the tops of the two column dividers and the play-area
    corner flourishes move from y=35 (3.86%) down to y=63 (6.94%), and the crest
    is re-centred + enlarged to fill the taller band. Keep the two files in sync
    for everything below the band. The matching frame-top / bar-h CSS var
    overrides live under :host-context(.small-device) in room/mansion styles.
  -->
  <defs>
    <!-- Corner flourish: the exact glyph from app-panel-frame (authored top-left,
         opening inward), reused at every corner via transforms. -->
    <g id="fbCorner" stroke="#e6c163" stroke-linecap="round">
      <path d="M3 22 L3 8 Q3 3 8 3 L22 3" stroke-width="1.3" />
      <path d="M9 18 L9 11 Q9 9 11 9 L18 9" stroke-width="1" opacity="0.7" />
      <circle cx="6.5" cy="6.5" r="1.4" fill="#e6c163" stroke="none" />
    </g>

    <!-- The quiet crest, straight from the popups. -->
    <g id="fbCrest" fill="#e6c163">
      <polygon points="8,11 50,10 50,12" />
      <circle cx="53" cy="11" r="1.5" />
      <path d="M66 3 L74 11 L66 19 L58 11 Z" fill="none" stroke="#e6c163" stroke-width="1.2" />
      <circle cx="66" cy="11" r="2" />
      <circle cx="79" cy="11" r="1.5" />
      <polygon points="124,11 82,10 82,12" />
    </g>

    <filter id="fbGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#e6c163" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer border: a single hairline hugging the shell edge. -->
  <rect x="4" y="4" width="1648" height="899" stroke="#e6c163" stroke-width="2" opacity="0.5" />

  <!-- Full-width rule under the (taller) toolbar band. -->
  <line x1="4" y1="63" x2="1652" y2="63" stroke="#e6c163" stroke-width="1.6" opacity="0.4" />

  <!-- The two column dividers: they bound the play area and enclose each side
       panel together with the outer border. -->
  <line x1="269" y1="63" x2="269" y2="903" stroke="#e6c163" stroke-width="1.6" opacity="0.4" />
  <line x1="1386" y1="63" x2="1386" y2="903" stroke="#e6c163" stroke-width="1.6" opacity="0.4" />

  <!-- Outer corner flourishes. -->
  <use href="#fbCorner" transform="translate(4,4) scale(1.3)" opacity="0.85" />
  <use href="#fbCorner" transform="translate(1652,4) scale(-1.3,1.3)" opacity="0.85" />
  <use href="#fbCorner" transform="translate(1652,903) scale(-1.3,-1.3)" opacity="0.85" />
  <use href="#fbCorner" transform="translate(4,903) scale(1.3,-1.3)" opacity="0.85" />

  <!-- Play-area corner flourishes, hugging the divider junctions so the side
       panels read as framed. -->
  <use href="#fbCorner" transform="translate(269,63) scale(1.3)" opacity="0.6" />
  <use href="#fbCorner" transform="translate(1386,63) scale(-1.3,1.3)" opacity="0.6" />
  <use href="#fbCorner" transform="translate(1386,903) scale(-1.3,-1.3)" opacity="0.6" />
  <use href="#fbCorner" transform="translate(269,903) scale(1.3,-1.3)" opacity="0.6" />

  <!-- Signature: the crest, centred in the taller top band above the rule. -->
  <use href="#fbCrest" transform="translate(729,15) scale(1.5)" filter="url(#fbGlow)" />
</svg>
